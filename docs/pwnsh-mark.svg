<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="pwnsh">
  <title>pwnsh</title>
  <!-- Hex socket: the single port many shells call back into -->
  <polygon points="94,50 72,88.1 28,88.1 6,50 28,11.9 72,11.9"
           fill="none" stroke="#54c7de" stroke-width="5" stroke-linejoin="round"/>
  <!-- Prompt caret -->
  <path d="M37 31 L56 50 L37 69"
        fill="none" stroke="#eaf0f6" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor block -->
  <rect x="61" y="42" width="7" height="16" rx="1" fill="#54c7de"/>
</svg>
