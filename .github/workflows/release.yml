name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token or secret is
# stored in the repo. Fires when you publish a GitHub Release.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   - Project name:        pwnsh
#   - Owner / repository:  unbreached/pwnsh
#   - Workflow name:       release.yml
#   - Environment name:    pypi
# Then: bump the version in pyproject.toml + src/pwnsh/__init__.py, tag it
# (git tag v0.7.0 && git push --tags) and publish a Release from that tag.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
